[project]
name = "qrc"
version = "0.1.0"
description = "Monitored spin quantum reservoir with weak measurement and reset: simulation and information processing capacity"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qrc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
